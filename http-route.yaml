apiVerison: networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prod-httproutes
  namespace: adithi-ns
spec:
  parentRefs:
    - name:
  rules:
    - matches:
        - path:
           type: PathPrefix
           value: /api/organic-ghee
      filters:
       - type: URLRewrite
         URLRewrite:
           path:
             type: ReplacePrefixMatch
             ReplacePrefixMatch: /organic-ghee
      backendRefs:
        - name: clusterip-service
          port: 5000