apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: organic-ghee-route
  namespace: adithi-ns

spec:
  parentRefs:
    - name: adithi-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: clusterip-service
          port: 5656